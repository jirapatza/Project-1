<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทำใบแนว</title><link rel="stylesheet" href="/studio.css"><body><main><h1>ทำใบแนว</h1><p>กรอกเลขของคุณ • หนึ่งหวยต่อหนึ่งภาพ</p><a href="/">กลับหน้าสูตร</a><p id="draftHint" role="status"></p><div id="studioGuideFeed"><div class="actions"><button type="button" id="fetchGuides">ดูใบแนวที่พร้อมใช้</button><div id="availableGuidesLabel" hidden><label>เลือกใบแนว<select id="availableGuides"></select></label></div></div><p id="guideFeedStatus" role="status"></p></div><p id="importedGuideSource"></p><section id="inputs"><label>ชื่อหวย<input id="lotteryName"></label><label>งวด<input id="drawDate" type="date"></label><label>เด่น<input id="standout" placeholder="0 9"></label><label>2 ตัว<input id="twoDigit" placeholder="09 90"></label><label>3 ตัว<input id="threeDigit" placeholder="009 090"></label><label>รูด–วิ่ง<input id="running" placeholder="0 9"></label></section><div id="backgroundSettings"><label>สีพื้นหลัง<input id="background" type="color" value="#750e20"></label><label>ภาพพื้นหลัง PNG/JPEG/WebP ไม่เกิน 2 MB<input id="backgroundFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="clearBackground">ลบภาพพื้นหลัง</button></div><div class="actions"><button id="save">บันทึกแบบในเครื่อง</button><button id="load">เปิดแบบที่บันทึก</button><button id="undo">ย้อนกลับ</button><button id="export">ดาวน์โหลด PNG</button><button id="shareLine">แชร์ไป LINE</button></div><p id="status" role="status"></p><canvas id="preview" width="900" height="1200" aria-label="ภาพตัวอย่างใบแนว"></canvas><div id="layoutSettings"><h2>ปรับช่อง</h2><label>เลือกช่อง<select id="box"></select></label><label>ฟอนต์ช่องที่เลือก<select id="font"><option value="sans-serif">ไม่มีเชิง</option><option value="serif">มีเชิง</option><option value="monospace">ความกว้างคงที่</option></select></label><section id="properties"></section><button id="add">เพิ่มข้อความ</button><button id="remove">ลบช่องที่เลือก</button></div></main><script type="module" src="/studio.js"></script></body></html>
