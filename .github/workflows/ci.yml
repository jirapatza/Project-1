name: Project-1 checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: project1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Project-1
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check bombim-source.js
          node --check history-audit.js
          node --check lao-snapshot.mjs
          node --check guide-poll.mjs
          node --check cloudflare/history-worker.js
          node --check cloudflare/guide-input-worker.js
      - name: Run all Project-1 tests
        run: npm test
